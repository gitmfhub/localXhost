<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localXhost</title>
    <style>
        /* إزالة الهوامش والحشو الافتراضية وجعل الصفحة تأخذ كامل الارتفاع */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* لمنع ظهور أشرطة تمرير مزدوجة */
        }
        
        /* جعل الإطار يملأ الشاشة بالكامل وإزالة حدوده */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://localxhost.blogspot.com" title="الموقع المعروض"></iframe>

</body>
</html>
