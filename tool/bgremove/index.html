<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>localXhost-bgRemove</title>

<!-- PWA -->
<link rel="manifest" href="/localXhost/tool/bgremove/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="https://gitmfhub.github.io/localXhost/asset/images/localxhost16-9.png">
<link rel="apple-touch-icon" href="https://gitmfhub.github.io/localXhost/asset/images/localxhost16-9.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="bgRemove">

<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:#000;
    color:#e9e9e9;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .logo{height:42px;width:auto;display:block;border-radius:6px}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px}
  .sub{margin:3px 0 0;font-size:12px;color:#6b6b6b}

  /* ---------- drop zone ---------- */
  .drop{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:36px 20px;
    border:1px dashed #262626;border-radius:12px;background:#080808;
    cursor:pointer;text-align:center;
    transition:border-color .15s,background .15s;
  }
  .drop:hover,.drop.over{border-color:#3ea6ff;background:#0a1017}
  .drop b{color:#e9e9e9;font-weight:600}
  .drop span{font-size:14px;color:#cfcfcf}
  .drop small{font-size:11px;color:#666}
  #file{display:none}

  /* ---------- toolbar ---------- */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:20px 0 16px}
  .tol{display:flex;align-items:center;gap:9px;font-size:12px;color:#8a8a8a;user-select:none}
  .tol output{color:#cfcfcf;min-width:18px;display:inline-block;text-align:right}
  input[type=range]{
    width:132px;accent-color:#3ea6ff;background:transparent;cursor:pointer;
  }
  .btn{
    background:#fff;color:#000;border:0;border-radius:8px;
    padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s;
  }
  .btn:hover{background:#d6d6d6}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:12px;overflow:hidden}
  .thumb{
    display:flex;align-items:center;justify-content:center;
    min-height:150px;padding:8px;
    background-color:#070707;
    background-image:
      linear-gradient(45deg,#141414 25%,transparent 25%),
      linear-gradient(-45deg,#141414 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#141414 75%),
      linear-gradient(-45deg,transparent 75%,#141414 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0;
  }
  .thumb canvas{max-width:100%;max-height:260px;display:block}
  .meta{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid #161616}
  .name{
    flex:1;font-size:11px;color:#7d7d7d;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dl{
    flex:none;background:#161616;color:#e9e9e9;border:1px solid #262626;
    border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .dl:hover:not(:disabled){background:#1f1f1f;border-color:#333}
  .dl:disabled{opacity:.4;cursor:default}

  #status{font-size:12px;color:#6b6b6b;margin:12px 0 0;min-height:16px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" alt="localXhost"
         src="https://gitmfhub.github.io/localXhost/asset/images/localxhost16-9.png"
         onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22><rect width=%22320%22 height=%22180%22 fill=%22%23000000%22/><text x=%22160%22 y=%22102%22 font-family=%22Arial,Helvetica,sans-serif%22 font-size=%2230%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>localXhost</text></svg>'">
    <div>
      <h1>localXhost-bgRemove</h1>
      <p class="sub">Remove image backgrounds — 100% offline, in your browser.</p>
    </div>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/png,image/jpeg,image/jpg" multiple>
    <span>Drop images here or <b>click to browse</b></span>
    <small>JPG, PNG · images never leave your device</small>
  </label>

  <div class="bar" id="bar" hidden>
    <label class="tol">
      Tolerance
      <input type="range" id="tolerance" min="10" max="90" step="1" value="32">
      <output id="tolVal">32</output>
    </label>
    <button class="btn" id="downloadAll">Download All</button>
  </div>

  <div class="grid" id="grid"></div>
  <p id="status"></p>

</div>

<script>
(function () {
  "use strict";

  var MAX_DIM = 2000; // cap processing size for speed

  var fileInput   = document.getElementById('file');
  var dropZone    = document.getElementById('drop');
  var grid        = document.getElementById('grid');
  var bar         = document.getElementById('bar');
  var statusEl    = document.getElementById('status');
  var tolInput    = document.getElementById('tolerance');
  var tolVal      = document.getElementById('tolVal');
  var downloadAll = document.getElementById('downloadAll');

  var items = [];      // { name, canvas, origData, blobUrl, dl }
  var tolTimer = null;

  /* ------------------------------------------------------------------ */
  /* helpers                                                             */
  /* ------------------------------------------------------------------ */

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Cannot read ' + file.name)); };
      img.src = url;
    });
  }

  function cloneImageData(src) {
    try {
      return new ImageData(new Uint8ClampedArray(src.data), src.width, src.height);
    } catch (e) {
      var c = document.createElement('canvas');
      c.width = src.width; c.height = src.height;
      var out = c.getContext('2d').createImageData(src.width, src.height);
      out.data.set(src.data);
      return out;
    }
  }

  function outName(name) {
    return name.replace(/\.[^.]+$/, '') + '-bgremoved.png';
  }

  function triggerDownload(url, filename) {
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  /* ------------------------------------------------------------------ */
  /* background removal (offline, pure canvas)                           */
  /* ------------------------------------------------------------------ */

  function removeBackground(imgData, tol) {
    var w = imgData.width, h = imgData.height, d = imgData.data, total = w * h;

    var mask    = new Uint8Array(total);   // 1 = background
    var visited = new Uint8Array(total);
    var queue   = new Int32Array(total);
    var qh = 0, qt = 0;

    var t2  = tol * tol * 3;                       // local colour threshold
    var g2  = (tol * 2.6) * (tol * 2.6) * 3;       // global drift guard

    /* average colour of the border */
    var sr = 0, sg = 0, sb = 0, n = 0, p;
    for (var x = 0; x < w; x++) {
      p = x * 4;                    sr += d[p]; sg += d[p + 1]; sb += d[p + 2]; n++;
      p = ((h - 1) * w + x) * 4;    sr += d[p]; sg += d[p + 1]; sb += d[p + 2]; n++;
    }
    for (var y = 0; y < h; y++) {
      p = (y * w) * 4;              sr += d[p]; sg += d[p + 1]; sb += d[p + 2]; n++;
      p = (y * w + w - 1) * 4;      sr += d[p]; sg += d[p + 1]; sb += d[p + 2]; n++;
    }
    var ar = sr / n, ag = sg / n, ab = sb / n;

    /* seed every border pixel as background */
    function seed(i) {
      if (!visited[i]) { visited[i] = 1; mask[i] = 1; queue[qt++] = i; }
    }
    for (var bx = 0; bx < w; bx++) { seed(bx); seed((h - 1) * w + bx); }
    for (var by = 0; by < h; by++) { seed(by * w); seed(by * w + w - 1); }

    /* flood fill */
    while (qh < qt) {
      var i = queue[qh++];
      var pp = i * 4;
      var r = d[pp], g = d[pp + 1], b = d[pp + 2];
      var cx = i % w;
      var cy = (i - cx) / w;

      for (var k = 0; k < 4; k++) {
        var ni;
        if (k === 0)      { if (cx === 0)     continue; ni = i - 1; }
        else if (k === 1) { if (cx === w - 1) continue; ni = i + 1; }
        else if (k === 2) { if (cy === 0)     continue; ni = i - w; }
        else              { if (cy === h - 1) continue; ni = i + w; }

        if (visited[ni]) continue;

        var q = ni * 4;
        var dr = d[q] - r, dg = d[q + 1] - g, db = d[q + 2] - b;
        if (dr * dr + dg * dg + db * db > t2) continue;

        var er = d[q] - ar, eg = d[q + 1] - ag, eb = d[q + 2] - ab;
        if (er * er + eg * eg + eb * eb > g2) continue;

        visited[ni] = 1; mask[ni] = 1; queue[qt++] = ni;
      }
    }

    /* feather the edge (3x3 box blur on the mask, then remap) */
    for (var fy = 0; fy < h; fy++) {
      var y0 = fy > 0 ? fy - 1 : fy;
      var y1 = fy < h - 1 ? fy + 1 : fy;
      for (var fx = 0; fx < w; fx++) {
        var x0 = fx > 0 ? fx - 1 : fx;
        var x1 = fx < w - 1 ? fx + 1 : fx;
        var sum = 0, c = 0;
        for (var yy = y0; yy <= y1; yy++) {
          var row = yy * w;
          for (var xx = x0; xx <= x1; xx++) { sum += mask[row + xx]; c++; }
        }
        var bl = sum / c;
        var a = (0.5 - bl) * 4 + 0.5;
        a = a < 0 ? 0 : (a > 1 ? 1 : a);

        var idx = (fy * w + fx) * 4 + 3;
        var orig = d[idx];
        d[idx] = Math.min(orig, Math.round(a * 255));
      }
    }

    return imgData;
  }

  /* ------------------------------------------------------------------ */
  /* item handling                                                       */
  /* ------------------------------------------------------------------ */

  function processItem(item) {
    var src = item.origData;
    var out = cloneImageData(src);
    removeBackground(out, parseInt(tolInput.value, 10));

    var ctx = item.canvas.getContext('2d');
    ctx.putImageData(out, 0, 0);

    item.canvas.toBlob(function (blob) {
      if (!blob) return;
      if (item.blobUrl) URL.revokeObjectURL(item.blobUrl);
      item.blobUrl = URL.createObjectURL(blob);
      item.dl.disabled = false;
    }, 'image/png');
  }

  function addFile(file) {
    return loadImage(file).then(function (img) {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, MAX_DIM / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));

      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      var origData = ctx.getImageData(0, 0, w, h);

      /* --- card DOM --- */
      var card  = document.createElement('div');
      card.className = 'card';

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.appendChild(canvas);

      var meta  = document.createElement('div');
      meta.className = 'meta';

      var nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = file.name;
      nameEl.title = file.name;

      var dl = document.createElement('button');
      dl.className = 'dl';
      dl.type = 'button';
      dl.textContent = 'Download';
      dl.disabled = true;

      meta.appendChild(nameEl);
      meta.appendChild(dl);
      card.appendChild(thumb);
      card.appendChild(meta);
      grid.appendChild(card);

      var item = { name: file.name, canvas: canvas, origData: origData, blobUrl: null, dl: dl };
      items.push(item);

      dl.addEventListener('click', function () {
        if (item.blobUrl) triggerDownload(item.blobUrl, outName(item.name));
      });

      processItem(item);
    });
  }

  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList).filter(function (f) {
      return /^image\/(png|jpeg|jpg)$/i.test(f.type);
    });
    if (!files.length) return;

    statusEl.textContent = 'Processing ' + files.length + ' image(s)…';

    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain
        .then(function () { return addFile(file); })
        .then(function () { return new Promise(function (r) { setTimeout(r, 0); }); })
        .catch(function (err) { console.error(err); });
    });

    chain.then(function () {
      statusEl.textContent = '';
      bar.hidden = items.length === 0;
    });
  }

  /* ------------------------------------------------------------------ */
  /* events                                                              */
  /* ------------------------------------------------------------------ */

  fileInput.addEventListener('change', function (e) {
    handleFiles(e.target.files);
    e.target.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    dropZone.addEventListener(ev, function (e) {
      e.preventDefault();
      dropZone.classList.add('over');
    });
  });

  ['dragleave', 'drop'].forEach(function (ev) {
    dropZone.addEventListener(ev, function (e) {
      e.preventDefault();
      dropZone.classList.remove('over');
    });
  });

  dropZone.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      handleFiles(e.dataTransfer.files);
    }
  });

  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });

  tolInput.addEventListener('input', function () {
    tolVal.textContent = tolInput.value;
    clearTimeout(tolTimer);
    tolTimer = setTimeout(function () {
      if (!items.length) return;
      statusEl.textContent = 'Updating…';
      items.forEach(function (it, i) {
        setTimeout(function () {
          processItem(it);
          if (i === items.length - 1) statusEl.textContent = '';
        }, i * 10);
      });
    }, 220);
  });

  downloadAll.addEventListener('click', function () {
    var pending = items.filter(function (it) { return it.blobUrl; });
    pending.forEach(function (it, i) {
      setTimeout(function () {
        triggerDownload(it.blobUrl, outName(it.name));
      }, i * 300);
    });
  });

})();
</script>

<!-- PWA: register service worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('/localXhost/tool/bgremove/sw.js', {
          scope: '/localXhost/tool/bgremove/'
        })
        .then(function (reg) { console.log('SW registered:', reg.scope); })
        .catch(function (err) { console.error('SW registration failed:', err); });
    });
  }
</script>
</body>
</html>
